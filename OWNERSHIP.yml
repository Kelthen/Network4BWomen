# OWNERSHIP.yml — Registre « qui possède quoi »
# Source de vérité pour trancher tout conflit de périmètre.
# Lu par les deux Claude AVANT d'agir (voir CLAUDE.md §1).
# owner: rhamon | serge | shared
# status: todo | wip | done
# Mettre à jour par PR quand une zone change de statut/propriétaire.
#
# ⚠️ NOTE POUR LE CLAUDE DE SERGE (lire avant d'agir) — état au 2026-08-17 :
# 1. LANGUE : tout le site est désormais en ANGLAIS (demande client). Ne PAS réintroduire
# de français dans les textes visibles. Les commentaires de code peuvent rester en FR.
# 2. FONDATIONS : structure Next.js, design-system (tokens), layout (Nav/Footer/Land),
# client Supabase → FAITS. Ne pas les refaire. (Le `main` avait été corrompu puis réparé.)
# 3. ZONE RHAMON : Accueil, À propos, Get Involved, Contact, Dons (Stripe), Newsletter →
# TOUS FAITS et mergés. Ne pas y toucher.
# 4. PATTERN API : les routes serveur (contact, newsletter, stripe) lisent les secrets en env
# et renvoient un 503 propre si les clés manquent (build vert sans secrets). Réutilise ce
# pattern pour tes routes (ex. app/api/registrations).
# 5. TES PAGES (serge) : Programs, Events, Conference, Resources, News, Gallery ont été
# construites par le Claude de rhamon EN AIDE (serge indisponible) — contenu PLACEHOLDER,
# design cohérent, en anglais. Elles NE sont PAS à refaire : reprends-les pour remplacer le
# placeholder par le vrai contenu et les brancher sur Supabase (tables programs, events,
# registrations, resources, posts, gallery_media).
# 6. DÉPLOIEMENT : Vercel doit avoir Framework Preset = Next.js (sinon erreur "public").
# 7. DONS/DB : migration SQL des tables prête dans supabase/migrations/0001_*.sql (à exécuter
# dans Supabase). Guide d'activation Stripe fourni à l'humain.

meta:
repo: kelthen/Network4BWomen
client: Network of Black Women (NBW)
devs:
rhamon: { github: RhamonK, branch_prefix: feat/rhamon }
serge: { github: sergesanou, branch_prefix: feat/serge }

# --- FONDATIONS (à faire en premier, de façon coordonnée) ---
foundations:
- area: design-system
files: ["tailwind.config.ts", "app/globals.css", "docs/BRAND.md"]
owner: shared
status: done
note: "Amorcé en premier. Tokens de marque NBW. Changement = petit + atomique + push rapide."
- area: layout-global
files: ["app/layout.tsx", "components/Nav.tsx", "components/Footer.tsx", "components/LandAcknowledgment.tsx"]
owner: shared
status: done
note: "Nav + Footer + reconnaissance territoire Blackfoot (obligatoire)."
- area: supabase-schema
files: ["lib/supabase.ts", "supabase/**", "docs/DATA-MODEL.md"]
owner: shared
status: done
note: "Client fait (lib/supabase.ts). Toutes les tables créées + migrations versionnées (0001-0007)."
- area: ui-primitives
files: ["components/ui/**"]
owner: shared
status: todo
note: "Button, Card, Input, Section, Container. Base commune. Toujours pas amorcé."

# --- PAGES / ZONES rhamon ---
rhamon:
- area: homepage
files: ["app/(site)/page.tsx", "components/home/**"]
status: done
- area: about
files: ["app/(site)/about/**", "components/about/**"]
status: done
- area: get-involved
files: ["app/(site)/get-involved/**", "components/getinvolved/**"]
status: done
- area: donate-stripe
files: ["app/(site)/donate/**", "app/api/stripe/**", "components/donate/**"]
status: done
note: "Dons sécurisés Stripe Checkout + webhook."
- area: contact
files: ["app/(site)/contact/**", "app/api/contact/**", "components/contact/**"]
status: done
- area: newsletter
files: ["app/api/newsletter/**", "components/Newsletter.tsx"]
status: done
note: "Signup newsletter (footer + accueil)."

# --- PAGES / ZONES serge ---
serge:
- area: programs
files: ["app/(site)/programs/**", "components/programs/**"]
status: done
note: "Branchée sur Supabase (table programs). Reste : testimonials par programme + bouton d'inscription (voir PLAN-serge.md)."
- area: events
files: ["app/(site)/events/**", "app/api/registrations/**", "components/events/**"]
status: done
note: "Branchée sur Supabase (events, registrations) + page détail + inscription. Reste : vue calendrier."
- area: conference
files: ["app/(site)/conference/**", "components/conference/**"]
status: wip
note: "Speakers branchés (conference_speakers). Reste : itinéraire, hébergement, FAQ, pricing — bloqué sur contenu réel NBW."
- area: resources
files: ["app/(site)/resources/**", "components/resources/**"]
status: done
note: "Branchée sur Supabase (table resources), 7 catégories."
- area: news-blog
files: ["app/(site)/news/**", "components/news/**"]
status: done
note: "Branchée sur Supabase (table posts) + page détail article."
- area: gallery
files: ["app/(site)/gallery/**", "components/gallery/**"]
status: done
note: "Branchée sur Supabase (table gallery_media), par année."
- area: search
files: ["app/(site)/search/**", "components/search/SearchClient.tsx"]
status: wip
note: "PR feat/serge/search ouverte : index (pages statiques + programs/events/resources/posts) + filtrage instantané. Reste : lien dans la Nav (fichier shared, à coordonner avec rhamon) + review croisée."
